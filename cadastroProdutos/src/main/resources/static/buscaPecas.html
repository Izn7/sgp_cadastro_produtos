<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGP - Catálogo Geral</title>
    <link rel="stylesheet" href="css/buscaPecas.css">
</head>
<body>

<div class="container-sgp">
    
    <header class="header-sgp">
        <img src="img/LOGO SGP.png" alt="SGP" class="logo-min">
    </header>

    <div class="page-title-block">
        <h1>Catálogo Geral de Peças</h1>
        <p>Consulte a disponibilidade do estoque, localize registros e verifique inconformidades no inventário.</p>
    </div>

    <!-- Filtros esticados na horizontal -->
    <section class="card-sgp">
        <h2>Filtros Avançados</h2>
        <form>
            <div class="row-form">
                <div class="form-group col-3">
                    <label for="sku">SKU</label>
                    <input type="text" id="sku" class="input-control" placeholder="Ex: DISCO-FREIO">
                </div>
                <div class="form-group col-4">
                    <label for="descricao">Descrição da Peça</label>
                    <input type="text" id="descricao" class="input-control" placeholder="Digite termos de busca">
                </div>
                <div class="form-group col-3">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" class="input-control">
                        <option value="">Todas</option>
                        <option value="1">Motor</option>
                        <option value="2">Freios</option>
                    </select>
                </div>
                <div class="form-group col-2">
                    <label for="status">Status</label>
                    <select id="status" class="input-control">
                        <option value="ativos">Ativos</option>
                        <option value="todos">Todos</option>
                    </select>
                </div>
            </div>
            <div class="btn-action-group">
                <button type="reset" class="btn-secundario">Limpar Filtros</button>
                <button type="submit">Aplicar Filtro</button>
            </div>
        </form>
    </section>

    <!-- Lista de Resultados -->
    <section class="card-sgp">
        <h2>Resultados Encontrados</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>Descrição</th>
                        <th>Preço Venda</th>
                        <th>Estoque Atual</th>
                        <th>Status</th>
                        <th style="width: 100px;">Ações</th>
                    </tr>
                </thead>
                
            </table>
        </div>
    </section>

</div>

</body>
</html>
